# 配置先: kumechang/American-Mahjong/.github/workflows/kick-claude.yml
# cron-job.org から GitHub API(workflow_dispatch)で起動され、プロンプトファイルを claude-cli-server に送る。
name: kick-claude
on:
  workflow_dispatch:
    inputs:
      prompt_file:
        description: "送るプロンプトのファイル(prompts/ 配下の .md)"
        default: prompts/daily.md
      project:
        description: "claude-cli-server の案件名"
        default: mahjong

permissions:
  contents: read

jobs:
  kick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: プロンプトを送信
        env:
          URL: ${{ secrets.CLAUDE_SERVER_URL }}
          TOKEN: ${{ secrets.CLAUDE_SERVER_TOKEN }}
          FILE: ${{ inputs.prompt_file }}
          PROJECT: ${{ inputs.project }}
        run: |
          set -euo pipefail
          # 入力値は環境変数で受け、検証してから使う(スクリプトに直接埋め込まない)
          [[ $FILE =~ ^prompts/[A-Za-z0-9._-]+\.md$ && $FILE != *..* ]] || { echo "不正なプロンプトファイル: $FILE"; exit 1; }
          [[ $PROJECT =~ ^[a-z0-9][a-z0-9_-]{0,63}$ ]] || { echo "不正な案件名: $PROJECT"; exit 1; }
          [ -f "$FILE" ] || { echo "ファイルがありません: $FILE"; exit 1; }
          jq -Rs '{prompt: .}' "$FILE" |
            curl -fsS --retry 3 --retry-delay 5 --max-time 60 -X POST "$URL/projects/$PROJECT/run" \
              -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data-binary @-
          echo
